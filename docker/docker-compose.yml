services:
  seq:
    image: datalust/seq:latest
    container_name: Viv_Seq
    environment:
      - ACCEPT_EULA=Y
      - SEQ_API_KEY=viv_seq_77
    ports:
      - "5341:5341"
    volumes:
      - seq_data:/data
    networks:
      - viv-net
    restart: unless-stopped

  redis:
    image: redis:latest
    container_name: Viv_Redis
    command: redis-server --requirepass viv_redis_77
    ports:
      - "6379:6379"
    networks:
      - viv-net
    restart: unless-stopped

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: Viv_SQLServer
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=viv_sqlserver_77
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    networks:
      - viv-net
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4.0-management
    container_name: Viv_RabbitMQ
    environment:
      - RABBITMQ_DEFAULT_USER=viv
      - RABBITMQ_DEFAULT_PASS=viv_rabbitmq_77
      - RABBITMQ_DEFAULT_VHOST=/viv
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - viv-net
    restart: unless-stopped

  emqx:
    image: emqx/emqx:5.8
    container_name: Viv_EMQX
    environment:
      # Dashboard 管理员密码（EMQX 默认 public，必须改）
      - EMQX_DASHBOARD__DEFAULT_PASSWORD=viv_emqx_77
      # 文件授权源：每台设备只允许读写自己 clientId 的 topic 前缀，见 emqx/acl.conf
      # 注：这两条环境变量没生效时，在 Dashboard → 访问控制 → 授权 里手动加 File 数据源（同一个文件）
      - 'EMQX_AUTHORIZATION__SOURCES=[{"type":"file","enable":true,"path":"/opt/emqx/etc/acl.conf"}]'
      - EMQX_AUTHORIZATION__NO_MATCH=deny
    ports:
      - "1883:1883"   # MQTT
      - "8883:8883"   # MQTT over TLS
      - "8083:8083"   # MQTT over WebSocket
      - "18083:18083" # Dashboard
    volumes:
      - ./emqx/acl.conf:/opt/emqx/etc/acl.conf:ro
      - emqx_data:/opt/emqx/data
    networks:
      - viv-net
    restart: unless-stopped

  caddy:
    image: caddy:latest
    container_name: Viv-Caddy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    networks:
      - viv-net
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config

name: viv

networks:
  viv-net:
    driver: bridge

volumes:
  seq_data:
  sqlserver_data:
  emqx_data:
  caddy_data:
  caddy_config:
