%% Viv 设备接入 —— EMQX 文件授权源样例（EMQX 5.x 的 acl.conf 语法）
%%
%% 规则意图：一台设备只能读写自己 clientId 名下的 topic 前缀，其余一律拒绝。
%% 占位符：%c = clientId（设备侧用 machineId 当 clientId），%u = username。
%%
%% 注意这是「授权」（能不能碰某个 topic）；「认证」（你是谁）另配，见同目录 README.md。
%% 未实测：本文件尚未在真实 EMQX 上验证，首次启动请按 README 的步骤确认规则已加载。

%% Dashboard 自身与本地回环需要 $SYS 与全量主题
{allow, {username, {re, "^dashboard$"}}, subscribe, ["$SYS/#"]}.
{allow, {ipaddr, "127.0.0.1"}, all, ["$SYS/#", "#"]}.

%% 其他客户端禁止订阅 $SYS 与全量主题（避免设备监听整个集群）
{deny, all, subscribe, ["$SYS/#", {eq, "#"}]}.

%% 平台自己：要用 viv-platform 这个 username 接入（对应 MqttOption.UserName），
%% 它必须能订阅所有设备的上行主题。写成 username 而不是 clientId 前缀 ——
%% clientId 是客户端自己填的、可冒用，username 才是认证过的身份。
{allow, {username, "viv-platform"}, all, ["dev/#"]}.

%% 设备：只允许自己 clientId 下的主题（读与写）
{allow, all, all, ["dev/%c/#"]}.

%% 别人的设备主题显式拒绝（no_match 已是 deny，这里写出来是为了意图明确）
{deny, all, all, ["dev/#"]}.
