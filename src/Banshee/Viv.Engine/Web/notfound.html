<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 · Viv</title>

    <style>
        /* ===== 全局重置 & 变量 ===== */
        :root {
            --yellow: #d9ff00;
            --yellow-glow: rgba(217, 255, 0, 0.25);
            --bg-dark: #0b0b12;
            --bg-card: rgba(255, 255, 255, 0.04);
            --border-card: rgba(255, 255, 255, 0.07);
            --text-white: #f0f0f0;
            --text-muted: rgba(255, 255, 255, 0.5);
            --radius-card: 28px;
            --shadow-card: 0 30px 80px rgba(0, 0, 0, 0.6);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, 'Microsoft YaHei', Arial, sans-serif;
        }

        html,
        body {
            min-width: 320px;
            overflow-x: hidden;
            background: var(--bg-dark);
            color: var(--text-white);
        }

        button {
            font: inherit;
            border: none;
            cursor: pointer;
        }

        /* ===== 顶部导航 ===== */
        .top-header {
            position: relative;
            z-index: 20;
            width: 100%;
            height: 72px;
            padding: 0 130px;
            display: flex;
            align-items: center;
            gap: 30px;
            background: rgba(11, 11, 18, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
        }

        .logo-group {
            display: flex;
            align-items: center;
            gap: 14px;
            flex-shrink: 0;
        }

        .logo-box {
            width: 60px;
            height: 38px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--yellow);
            color: #000;
            font-size: 22px;
            font-weight: 900;
            letter-spacing: -0.5px;
            border-radius: 10px;
            transition: transform 0.3s ease;
        }

        .logo-box:hover {
            transform: scale(1.04);
        }

        .logo-text {
            color: #fff;
            font-size: 19px;
            font-weight: 500;
            letter-spacing: 1.5px;
            white-space: nowrap;
            opacity: 0.7;
        }

        .logo-text span {
            font-weight: 300;
            opacity: 0.5;
        }

        .nav-single {
            flex: 0 0 auto;
            margin-right: auto;
        }

        .nav-item {
            position: relative;
            display: inline-block;
            color: rgba(255, 255, 255, 0.5);
            font-size: 14px;
            font-weight: 500;
            letter-spacing: 0.3px;
            text-decoration: none;
            transition: color 0.3s ease;
        }

        .nav-item:hover {
            color: #fff;
        }

        .nav-item::after {
            content: '';
            position: absolute;
            left: 0;
            bottom: -10px;
            width: 100%;
            height: 2.5px;
            background: var(--yellow);
            border-radius: 4px;
            opacity: 0.6;
        }

        /* ===== 主区域 ===== */
        .main-wrap {
            position: relative;
            min-height: calc(100vh - 72px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 24px;
            overflow: hidden;
            background:
                radial-gradient(ellipse 80% 60% at 50% 30%, rgba(217, 255, 0, 0.06) 0%, transparent 70%),
                radial-gradient(ellipse 60% 50% at 20% 80%, rgba(217, 255, 0, 0.04) 0%, transparent 60%),
                radial-gradient(ellipse 50% 40% at 80% 20%, rgba(217, 255, 0, 0.03) 0%, transparent 50%),
                var(--bg-dark);
        }

        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            pointer-events: none;
            opacity: 0.5;
            animation: orbFloat 12s ease-in-out infinite alternate;
        }

        .orb--1 {
            width: 400px;
            height: 400px;
            top: -100px;
            right: -100px;
            background: rgba(217, 255, 0, 0.10);
            animation-delay: 0s;
        }

        .orb--2 {
            width: 300px;
            height: 300px;
            bottom: -60px;
            left: -60px;
            background: rgba(100, 120, 255, 0.08);
            animation-delay: -4s;
        }

        .orb--3 {
            width: 200px;
            height: 200px;
            top: 40%;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(217, 255, 0, 0.05);
            animation-delay: -8s;
            filter: blur(100px);
        }

        @keyframes orbFloat {
            0% {
                transform: translate(0, 0) scale(1);
            }

            33% {
                transform: translate(30px, -30px) scale(1.1);
            }

            66% {
                transform: translate(-20px, 20px) scale(0.9);
            }

            100% {
                transform: translate(10px, -10px) scale(1.05);
            }
        }

        .particles {
            position: absolute;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
        }

        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: var(--yellow);
            border-radius: 50%;
            opacity: 0.15;
            animation: particleDrift 18s linear infinite;
        }

        .particle:nth-child(1) {
            left: 10%;
            top: 20%;
            animation-duration: 22s;
            animation-delay: 0s;
            width: 6px;
            height: 6px;
        }

        .particle:nth-child(2) {
            left: 85%;
            top: 15%;
            animation-duration: 26s;
            animation-delay: -3s;
            width: 3px;
            height: 3px;
        }

        .particle:nth-child(3) {
            left: 20%;
            top: 80%;
            animation-duration: 20s;
            animation-delay: -6s;
            width: 5px;
            height: 5px;
        }

        .particle:nth-child(4) {
            left: 70%;
            top: 70%;
            animation-duration: 24s;
            animation-delay: -9s;
            width: 4px;
            height: 4px;
        }

        .particle:nth-child(5) {
            left: 50%;
            top: 10%;
            animation-duration: 28s;
            animation-delay: -12s;
            width: 3px;
            height: 3px;
        }

        .particle:nth-child(6) {
            left: 40%;
            top: 90%;
            animation-duration: 20s;
            animation-delay: -5s;
            width: 5px;
            height: 5px;
        }

        @keyframes particleDrift {
            0% {
                transform: translate(0, 0) scale(1);
                opacity: 0.08;
            }

            25% {
                transform: translate(60px, -80px) scale(1.4);
                opacity: 0.25;
            }

            50% {
                transform: translate(-40px, 60px) scale(0.8);
                opacity: 0.10;
            }

            75% {
                transform: translate(80px, 40px) scale(1.2);
                opacity: 0.20;
            }

            100% {
                transform: translate(0, 0) scale(1);
                opacity: 0.08;
            }
        }

        /* ---- 404 卡片 ---- */
        .error-card {
            position: relative;
            z-index: 10;
            max-width: 640px;
            width: 100%;
            padding: 56px 52px 48px;
            background: var(--bg-card);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid var(--border-card);
            border-radius: var(--radius-card);
            box-shadow: var(--shadow-card), inset 0 1px 0 rgba(255, 255, 255, 0.04);
            text-align: center;
            animation: cardEntry 0.9s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
            transform: translateY(30px) scale(0.97);
        }

        @keyframes cardEntry {
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .error-code {
            font-size: 88px;
            font-weight: 800;
            line-height: 1;
            letter-spacing: -3px;
            background: linear-gradient(135deg, #fff 20%, rgba(255, 255, 255, 0.3));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 8px;
        }

        .error-badge {
            display: inline-block;
            padding: 4px 18px;
            border-radius: 999px;
            background: rgba(248, 113, 113, 0.12);
            border: 1px solid rgba(248, 113, 113, 0.15);
            color: #f87171;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.8px;
            text-transform: uppercase;
            margin-bottom: 20px;
        }

        .error-icon {
            font-size: 56px;
            line-height: 1;
            margin-bottom: 8px;
            display: block;
            filter: drop-shadow(0 8px 24px rgba(248, 113, 113, 0.15));
        }

        .error-title {
            font-size: 32px;
            font-weight: 700;
            letter-spacing: -0.5px;
            color: #fff;
            line-height: 1.2;
            margin-bottom: 12px;
        }

        .error-sub {
            font-size: 17px;
            font-weight: 400;
            color: var(--text-muted);
            margin-bottom: 32px;
            letter-spacing: 0.2px;
            line-height: 1.6;
        }

        .error-sub strong {
            color: var(--yellow);
            font-weight: 500;
            -webkit-text-fill-color: var(--yellow);
        }

        .card-actions {
            display: flex;
            gap: 14px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn-primary {
            padding: 14px 44px;
            border-radius: 999px;
            background: var(--yellow);
            color: #000;
            font-size: 15px;
            font-weight: 600;
            letter-spacing: 0.3px;
            transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            box-shadow: 0 0 0 0 var(--yellow-glow);
            text-decoration: none;
            display: inline-block;
        }

        .btn-primary:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 16px 48px -12px var(--yellow-glow);
            background: #e6ff2a;
        }

        .btn-primary:active {
            transform: scale(0.95);
        }

        /* ===== 响应式 ===== */
        @media (max-width: 900px) {
            .top-header {
                padding: 0 40px;
                gap: 20px;
            }
        }

        @media (max-width: 768px) {
            .top-header {
                height: 64px;
                padding: 0 20px;
                gap: 12px;
                background: rgba(11, 11, 18, 0.92);
            }

            .logo-box {
                width: 50px;
                height: 32px;
                font-size: 18px;
                border-radius: 8px;
            }

            .logo-text {
                font-size: 15px;
                letter-spacing: 0.8px;
            }

            .logo-text span {
                display: none;
            }

            .nav-single {
                display: none;
            }

            .main-wrap {
                min-height: calc(100vh - 64px);
                padding: 30px 16px;
            }

            .error-card {
                padding: 36px 24px 32px;
                border-radius: 20px;
            }

            .error-code {
                font-size: 60px;
            }

            .error-title {
                font-size: 24px;
            }

            .error-sub {
                font-size: 15px;
            }

            .error-icon {
                font-size: 44px;
            }

            .btn-primary {
                padding: 12px 32px;
                font-size: 14px;
            }

            .orb--1 {
                width: 250px;
                height: 250px;
                top: -60px;
                right: -60px;
            }

            .orb--2 {
                width: 200px;
                height: 200px;
                bottom: -40px;
                left: -40px;
            }
        }

        @media (max-width: 430px) {
            .top-header {
                height: 58px;
                padding: 0 14px;
                gap: 8px;
            }

            .logo-box {
                width: 42px;
                height: 28px;
                font-size: 15px;
            }

            .logo-text {
                font-size: 13px;
                letter-spacing: 0.4px;
            }

            .error-card {
                padding: 28px 18px 26px;
                border-radius: 16px;
            }

            .error-code {
                font-size: 48px;
                letter-spacing: -1px;
            }

            .error-title {
                font-size: 20px;
            }

            .error-sub {
                font-size: 13px;
                margin-bottom: 20px;
            }

            .error-icon {
                font-size: 36px;
                margin-bottom: 4px;
            }

            .error-badge {
                font-size: 10px;
                padding: 3px 14px;
                margin-bottom: 16px;
            }

            .btn-primary {
                padding: 10px 26px;
                font-size: 13px;
                width: 100%;
            }

            .orb--1 {
                width: 180px;
                height: 180px;
            }

            .orb--2 {
                width: 140px;
                height: 140px;
            }
        }
    </style>
</head>

<body>

    <!-- ===== 顶部导航 ===== -->
    <header class="top-header">
        <div class="logo-group">
            <div class="logo-box">Viv</div>
            <div class="logo-text">Api · <span>Service</span></div>
        </div>
        <div class="nav-single">
            <a href="/" class="nav-item">Home</a>
        </div>
    </header>

    <!-- ===== 主区域 ===== -->
    <main class="main-wrap">
        <div class="orb orb--1"></div>
        <div class="orb orb--2"></div>
        <div class="orb orb--3"></div>

        <div class="particles">
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
        </div>

        <section class="error-card">
            <div class="error-badge">● 资源不存在</div>
            <span class="error-icon">🔍</span>
            <div class="error-code">404</div>
            <h2 class="error-title">哎呀，迷路了</h2>
            <p class="error-sub">
                您访问的页面已被移除、更名或<br />
                <strong>暂时不可用</strong>
            </p>

            <div class="card-actions">
                <a href="/" class="btn-primary">← 返回首页</a>
            </div>
        </section>
    </main>

    <script>
        // 控制台提示
        console.log('%c❌ 404 · 页面未找到', 'font-size:18px; font-weight:700; color:#f87171;');
        console.log('%c🏠 点击“返回首页”回到 Viv API 启动页', 'font-size:13px; color:#888;');

        // 键盘快捷键：按 H 键返回首页
        document.addEventListener('keydown', function (e) {
            if ((e.key === 'h' || e.key === 'H') && !e.ctrlKey && !e.metaKey && !e.altKey) {
                const target = e.target;
                if (target.tagName !== 'INPUT' && target.tagName !== 'TEXTAREA' && target.tagName !== 'SELECT') {
                    e.preventDefault();
                    window.location.href = '/';
                }
            }
        });
    </script>

</body>
</html>
