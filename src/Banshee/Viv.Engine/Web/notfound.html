<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>404 · Viv</title>

    <style>
        /* 共享样式来自 web/app.css，由 ApiStartedMiddleware 注入 */
{SharedCss}

/* ---- 404 页特有：错误卡片 ---- */
.error-card {
    position: relative;
    z-index: 10;
    max-width: 640px;
    width: 100%;
    padding: 56px 52px 48px;
    background: var(--bg-card);
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    border: 1px solid var(--border-card);
    border-radius: var(--radius-card);
    box-shadow: var(--shadow-card), inset 0 1px 0 rgba(255, 255, 255, 0.04);
    text-align: center;
    animation: cardEntry 0.9s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    opacity: 0;
    transform: translateY(30px) scale(0.97);
}

.error-badge {
    display: inline-block;
    padding: 4px 18px;
    border-radius: 999px;
    background: rgba(248, 113, 113, 0.12);
    border: 1px solid rgba(248, 113, 113, 0.15);
    color: #f87171;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.8px;
    text-transform: uppercase;
    margin-bottom: 20px;
}

.error-icon {
    font-size: 56px;
    line-height: 1;
    margin-bottom: 8px;
    display: block;
    filter: drop-shadow(0 8px 24px rgba(248, 113, 113, 0.15));
}

.error-code {
    font-size: 88px;
    font-weight: 800;
    line-height: 1;
    letter-spacing: -3px;
    background: linear-gradient(135deg, #fff 20%, rgba(255, 255, 255, 0.3));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 8px;
}

.error-title {
    font-size: 32px;
    font-weight: 700;
    letter-spacing: -0.5px;
    color: #fff;
    line-height: 1.2;
    margin-bottom: 12px;
}

.error-sub {
    font-size: 17px;
    font-weight: 400;
    color: var(--text-muted);
    margin-bottom: 32px;
    letter-spacing: 0.2px;
    line-height: 1.6;
}

/* 回显用户实际访问的路径 —— 404 最常见的成因就是路径拼错，得让人看见自己进了哪 */
.error-sub code {
    color: var(--yellow);
    -webkit-text-fill-color: var(--yellow);
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 0.9em;
    word-break: break-all;
}

.error-sub strong {
    color: var(--yellow);
    font-weight: 500;
    -webkit-text-fill-color: var(--yellow);
}

@media (max-width: 768px) {
    .error-card {
        padding: 36px 24px 32px;
        border-radius: 20px;
    }

    .error-code {
        font-size: 60px;
    }

    .error-title {
        font-size: 24px;
    }

    .error-sub {
        font-size: 15px;
    }

    .error-icon {
        font-size: 44px;
    }
}

@media (max-width: 430px) {
    .error-card {
        padding: 28px 18px 26px;
        border-radius: 16px;
    }

    .error-code {
        font-size: 48px;
        letter-spacing: -1px;
    }

    .error-title {
        font-size: 20px;
    }

    .error-sub {
        font-size: 13px;
        margin-bottom: 20px;
    }

    .error-icon {
        font-size: 36px;
        margin-bottom: 4px;
    }

    .error-badge {
        font-size: 10px;
        padding: 3px 14px;
        margin-bottom: 16px;
    }
}
    </style>
</head>

<body>

    <header class="top-header">
        <div class="logo-group">
            <div class="logo-box">Viv</div>
            <div class="logo-text">Api · <span>Service</span></div>
        </div>
        <div class="nav-single">
            <a href="/" class="nav-item">Home</a>
        </div>
    </header>

    <main class="main-wrap">
        <div class="orb orb--1"></div>
        <div class="orb orb--2"></div>
        <div class="orb orb--3"></div>

        <div class="particles">
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
        </div>

        <section class="error-card">
            <div class="error-badge">● 资源不存在</div>
            <span class="error-icon">🔍</span>
            <div class="error-code">404</div>
            <h2 class="error-title">哎呀，迷路了</h2>
            <p class="error-sub">
                找不到 <code data-request-path>这个地址</code><br />
                页面可能被移除、更名，或路径拼写有误
            </p>

            <div class="card-actions">
                <a href="/" class="btn-primary">← 返回首页</a>
                <a href="/Scalar" class="btn-ghost">API 文档</a>
                <a href="/health" class="btn-ghost">健康检查</a>
            </div>
        </section>
    </main>

    <noscript>
        <p style="text-align:center;color:#888;padding:20px;">
            可以返回 <a href="/" style="color:#d9ff00;">首页</a>，或访问 <a href="/Scalar" style="color:#d9ff00;">/Scalar</a> 查看 API 文档。
        </p>
    </noscript>

    <script>window.__VIV__ = {State};</script>
    <script>
{SharedJs}
    </script>
</body>
</html>
