<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>Viv · 服务启动</title>

    <style>
        /* 共享样式来自 web/app.css，由 ApiStartedMiddleware 注入 */
{SharedCss}
    </style>
</head>

<body>

    <header class="top-header">
        <div class="logo-group">
            <div class="logo-box">Viv</div>
            <div class="logo-text">Api · <span>Service</span></div>
        </div>
        <div class="nav-single">
            <a href="#" class="nav-item">Welcome</a>
        </div>
    </header>

    <main class="main-wrap">
        <div class="orb orb--1"></div>
        <div class="orb orb--2"></div>
        <div class="orb orb--3"></div>

        <div class="particles">
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
        </div>

        <section class="welcome-card">
            <div class="card-badge">● 服务就绪</div>
            <span class="card-icon">⚡</span>
            <h1 class="card-title">Viv API</h1>
            <p class="card-sub">
                轻量 · 高效 · 即刻响应<br />
                <strong data-bind="serviceName">--</strong> 已启动
            </p>

            <div class="status-row">
                <span class="status-dot" data-health-dot></span>
                <span class="status-label" role="status" aria-live="polite">
                    服务状态 · <span data-health-text>检测中 …</span>
                </span>
            </div>

            <div class="card-meta">
                <div class="meta-item">
                    <span class="label">运行时长</span>
                    <span class="value" data-uptime>--</span>
                </div>
                <div class="meta-item">
                    <span class="label">环境</span>
                    <span class="value"><span class="highlight" data-bind="env">--</span></span>
                </div>
                <div class="meta-item">
                    <span class="label">机器Id</span>
                    <span class="value" data-bind="machineId">--</span>
                </div>
            </div>

            <div class="card-actions">
                <a href="/Scalar" class="btn-primary">查看 API 文档 →</a>
                <button type="button" class="btn-ghost" data-health-btn>● 健康检查</button>
            </div>
        </section>
    </main>

    <noscript>
        <p style="text-align:center;color:#888;padding:20px;">
            这个页面依赖 JavaScript 渲染服务信息。禁用脚本时请直接访问 <a href="/Scalar" style="color:#d9ff00;">/Scalar</a> 查看 API 文档。
        </p>
    </noscript>

    <script>window.__VIV__ = {State};</script>
    <script>
{SharedJs}
    </script>
</body>
</html>
