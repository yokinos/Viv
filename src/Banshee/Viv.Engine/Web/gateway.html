<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>Viv · 网关启动</title>

    <style>
        /* 共享样式来自 web/app.css，由 ApiStartedMiddleware 注入 */
{SharedCss}

/* ---- 网关页特有：已注册服务列表（点击经网关打开该服务的 Scalar 文档） ---- */
.service-list {
    display: flex;
    justify-content: center;
    gap: 12px;
    flex-wrap: wrap;
    margin-bottom: 32px;
    padding: 16px 20px;
    background: rgba(255, 255, 255, 0.02);
    border-radius: 16px;
    border: 1px solid rgba(255, 255, 255, 0.04);
}

/* 没有已注册服务时（独立启动、没连 AppHost）不占位 */
.service-list:empty {
    display: none;
}

.service-tag {
    padding: 4px 16px;
    border-radius: 999px;
    background: rgba(217, 255, 0, 0.06);
    border: 1px solid rgba(217, 255, 0, 0.08);
    color: rgba(255, 255, 255, 0.6);
    font-size: 13px;
    font-weight: 500;
    transition: all 0.3s ease;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    cursor: pointer;
}

.service-tag:hover {
    background: rgba(217, 255, 0, 0.15);
    color: #fff;
    border-color: rgba(217, 255, 0, 0.3);
    transform: translateY(-2px);
    box-shadow: 0 8px 24px rgba(217, 255, 0, 0.1);
}

.service-tag .status {
    display: inline-block;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #4ade80;
    flex-shrink: 0;
}

.service-tag .arrow {
    font-size: 11px;
    opacity: 0.4;
    transition: opacity 0.3s;
}

.service-tag:hover .arrow {
    opacity: 1;
}

@media (max-width: 768px) {
    .service-list {
        gap: 8px;
        padding: 12px 16px;
    }

    .service-tag {
        font-size: 12px;
        padding: 3px 14px;
    }
}

@media (max-width: 430px) {
    .service-list {
        gap: 6px;
        padding: 10px 12px;
    }

    .service-tag {
        font-size: 11px;
        padding: 3px 12px;
    }
}
    </style>
</head>

<body>

    <header class="top-header">
        <div class="logo-group">
            <div class="logo-box">Viv</div>
            <div class="logo-text">Gateway · <span>Service</span></div>
        </div>
        <div class="nav-single">
            <a href="#" class="nav-item">Gateway</a>
        </div>
    </header>

    <main class="main-wrap">
        <div class="orb orb--1"></div>
        <div class="orb orb--2"></div>
        <div class="orb orb--3"></div>

        <div class="particles">
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
        </div>

        <section class="welcome-card">
            <div class="card-badge">● 网关就绪</div>
            <span class="card-icon">🌐</span>
            <h1 class="card-title">Viv Gateway</h1>
            <p class="card-sub">
                统一入口 · 智能路由 · 安全转发<br />
                <strong data-bind="serviceName">--</strong> 已启动
            </p>

            <div class="status-row">
                <span class="status-dot" data-health-dot></span>
                <span class="status-label" role="status" aria-live="polite">
                    网关状态 · <span data-health-text>检测中 …</span>
                </span>
            </div>

            <div class="card-meta">
                <div class="meta-item">
                    <span class="label">运行时长</span>
                    <span class="value" data-uptime>--</span>
                </div>
                <div class="meta-item">
                    <span class="label">环境</span>
                    <span class="value"><span class="highlight" data-bind="env">--</span></span>
                </div>
                <div class="meta-item">
                    <span class="label">机器Id</span>
                    <span class="value" data-bind="machineId">--</span>
                </div>
            </div>

            <div class="service-list" data-services></div>

            <div class="card-actions">
                <button type="button" class="btn-primary" data-health-btn>● 健康检查</button>
                <a href="/" class="btn-ghost">返回首页</a>
            </div>
        </section>
    </main>

    <noscript>
        <p style="text-align:center;color:#888;padding:20px;">
            这个页面依赖 JavaScript 渲染服务信息。禁用脚本时请直接访问下游服务的 <code>/scalar</code> 文档。
        </p>
    </noscript>

    <script>window.__VIV__ = {State};</script>
    <script>
{SharedJs}
    </script>
</body>
</html>
