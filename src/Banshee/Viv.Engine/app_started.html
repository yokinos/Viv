<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Viv | Started</title>

  <style>
    :root {
      --yellow: #d9ff00;
      --page-bg: #f2f2f2;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Helvetica, "Microsoft YaHei", Arial, sans-serif;
    }

    html,
    body {
      min-width: 320px;
      overflow-x: hidden;
    }

    body {
      color: #111;
      background: var(--page-bg);
    }

    button {
      font: inherit;
    }

    /* 顶部导航 */
    .top-header {
      position: relative;
      z-index: 10;

      width: 100%;
      height: 68px;
      padding: 0 130px;

      display: flex;
      align-items: center;
      gap: 50px;

      background: #000;
    }

    .logo-group {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }

    .logo-box {
      width: 60px;
      height: 38px;

      display: flex;
      align-items: center;
      justify-content: center;

      color: #000;
      background: #fff;

      font-size: 24px;
      font-weight: 900;
      line-height: 1;
    }

    .logo-text {
      color: #fff;
      font-size: 20px;
      font-weight: 600;
      letter-spacing: 1px;
      white-space: nowrap;
    }

    .nav-single {
      flex: 1;
    }

    .nav-item {
      position: relative;

      display: inline-block;

      color: #fff;
      font-size: 15px;
      line-height: 1;
      text-decoration: none;
    }

    .nav-item::after {
      content: "";

      position: absolute;
      left: 0;
      bottom: -10px;

      width: 100%;
      height: 3px;

      background: #fff;
    }

    .header-btn {
      flex-shrink: 0;

      padding: 9px 24px;

      color: #000;
      background: var(--yellow);
      border: none;
      border-radius: 999px;

      font-size: 15px;
      font-weight: 600;

      cursor: pointer;
      transition: .25s ease;
    }

    .header-btn:hover {
      color: #fff;
      background: #333;
      transform: translateY(-2px);
    }

    /* 页面主体 */
    .main-wrap {
      min-height: calc(100vh - 68px);

      background:
        linear-gradient(
          120deg,
          #ededed 0%,
          #f8f8f8 50%,
          #ededed 100%
        );
    }

    /* 移动端适配 */
    @media (max-width: 768px) {
      .top-header {
        height: 60px;
        padding: 0 20px;
        gap: 15px;
      }

      .logo-box {
        width: 60px;
        height: 32px;
        font-size: 20px;
      }

      .logo-text {
        font-size: 16px;
      }

      .nav-single {
        display: none;
      }

      .header-btn {
        margin-left: auto;
        padding: 8px 14px;
        font-size: 12px;
      }

      .main-wrap {
        min-height: calc(100vh - 60px);
      }
    }

    @media (max-width: 400px) {
      .logo-text {
        display: none;
      }

      .header-btn {
        padding: 8px 11px;
      }
    }
  </style>
</head>

<body>

  <!-- 顶部导航 -->
  <header class="top-header">
    <div class="logo-group">
      <div class="logo-box">Viv</div>
      <div class="logo-text">Api · Service</div>
    </div>

    <div class="nav-single">
      <a href="#" class="nav-item">Welcome</a>
    </div>

    <button
      type="button"
      class="header-btn"
      id="openDocBtn"
    >
      打开API文档
    </button>
  </header>

  <!-- 空白主体区域 -->
  <main class="main-wrap"></main>

  <script>
    const openDocBtn = document.getElementById("openDocBtn");

    openDocBtn.addEventListener("click", function () {
      window.location.href = "/scale";
    });
  </script>

</body>
</html>
