<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - 页面不存在</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #e4eaf5 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #333;
        }

        .container {
            text-align: center;
            padding: 20px;
            max-width: 600px;
        }

        .title {
            font-size: 120px;
            font-weight: bold;
            color: #4a6cf7;
            animation: float 2s infinite ease-in-out;
        }

        .subtitle {
            font-size: 24px;
            margin: 20px 0;
            color: #555;
        }

        .desc {
            font-size: 16px;
            color: #888;
            margin-bottom: 30px;
        }

        .btn {
            display: inline-block;
            padding: 12px 30px;
            background: #4a6cf7;
            color: white;
            border-radius: 8px;
            text-decoration: none;
            font-size: 16px;
            transition: all 0.3s;
        }

        .btn:hover {
            background: #3a5ce2;
            transform: translateY(-2px);
        }

        @keyframes float {
            0%,100% { transform: translateY(0px); }
            50% { transform: translateY(-15px); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="title">404</div>
        <div class="subtitle">页面不存在或已被移除</div>
    </div>
</body>
</html>
